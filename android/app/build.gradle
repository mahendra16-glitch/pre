plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode', '1')
def flutterVersionName = localProperties.getProperty('flutter.versionName', '1.0.0')

// Keystore
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    // FALLBACK: LOAD FROM local.properties
    keystoreProperties['storeFile'] = localProperties.getProperty('storeFile')
    keystoreProperties['storePassword'] = localProperties.getProperty('storePassword')
    keystoreProperties['keyAlias'] = localProperties.getProperty('keyAlias')
    keystoreProperties['keyPassword'] = localProperties.getProperty('keyPassword')
}

android {
    namespace "com.mygenie.online"

    compileSdkVersion 36     // REQUIRED for androidx.lifecycle:2.7.x
    ndkVersion "26.1.10909125"   // REQUIRED for 16kb pages

    defaultConfig {
        applicationId "com.mygenie.online"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 98
        versionName '10.17.0'
        multiDexEnabled true
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17   // Java 17 only (AGP requirement)
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'  // Must match Java 17
    }
}

dependencies {
    implementation "com.google.firebase:firebase-messaging:23.4.1"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
