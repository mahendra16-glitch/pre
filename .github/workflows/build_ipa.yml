name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios
          pod install
          cd ..

      - name: Build Unsigned IPA
        run: |
          flutter build ipa --release --no-codesign
          mkdir -p "$GITHUB_WORKSPACE/build/ios/ipa"
          if [ -d "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive/Products/Applications" ]; then
            cd "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive/Products/Applications"
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r "$GITHUB_WORKSPACE/build/ios/ipa/mygenie_restaurant_Unsigned.ipa" Payload
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mygenie_restaurant_iOS_IPA
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/Runner.xcarchive
          retention-days: 7
