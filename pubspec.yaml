  flutter_typeahead: ^4.8.0
  fluttertoast: ^8.2.12
  font_awesome_flutter: ^10.8.0
  geolocator: ^11.0.0
  get: ^4.6.6
  get_storage: ^2.1.1
  google_maps_flutter: ^2.12.3
  http: ^1.2.1
  image_picker: '>=1.0.0 <1.3.0'
  intl: '>=0.19.0 <0.21.0'
  ios_ble_printer:
    path: packages/ios_ble_printer
  jiffy: ^6.2.1
  loading_animation_widget: ^1.2.1
  local_auth: ^2.2.0
  map_launcher: ^3.5.0
  modal_bottom_sheet: ^3.0.0
  month_picker_dialog: ^6.0.3
  multi_select_flutter: ^4.1.3
  open_file: ^3.3.0
  package_info_plus: ^8.3.0
  path_provider: ^2.1.2
  pdf: ^3.11.3
  permission_handler: ^11.3.0
  photo_view: ^0.15.0
  print_bluetooth_thermal: ^1.1.0
  printing: ^5.13.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  shimmer_animation: ^2.1.0
  socket_io_client: ^2.0.3+1
  syncfusion_flutter_datepicker: 29.1.37
  syncfusion_flutter_xlsio: 29.1.37
  table_calendar: ^3.0.9
  upgrader: '>=10.0.0 <12.0.0'
  url_launcher: ^6.3.1
  url_strategy: ^0.2.0
  vibration: ^3.1.3
  win_toast: null

dependency_overrides:
  sqflite: '>=2.3.0 <2.4.0'
  syncfusion_flutter_core: 29.1.37
  flutter_plugin_android_lifecycle: ^2.0.27
  geolocator_android: ^4.4.1
  modal_bottom_sheet:
    git:
      url: https://github.com/followthemoney1/modal_bottom_sheet.git
      ref: main
      path: modal_bottom_sheet

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/language/
    - assets/sound/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto-Black.ttf
          weight: 900
    - family: Poppins
      fonts:
        - asset: assets/font/Poppins-Light.ttf
          weight: 300
        - asset: assets/font/Poppins-Regular.ttf
          weight: 400
        - asset: assets/font/Poppins-Medium.ttf
          weight: 500
        - asset: assets/font/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/font/Poppins-Bold.ttf
          weight: 700
        - asset: assets/font/Poppins-Black.ttf
          weight: 900
    - family: Montserrat
      fonts:
        - asset: assets/font/Montserrat-Black.ttf
          weight: 900
        - asset: assets/font/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/font/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/font/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/font/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/font/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/font/Montserrat-Light.ttf
          weight: 300
        - asset: assets/font/Montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Montserrat-Thin.ttf
          weight: 100
    - family: Rupee_Foradian
      fonts:
        - asset: assets/font/Rupee_Foradian.ttf
          weight: 400
