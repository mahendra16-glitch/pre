name: mygenie_restaurant
description: An application for multivendor ecommerce restaurant.
publish_to: "none"
version: 1.1.1+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  animated_read_more_text: ^0.0.6
  audioplayers: ^6.1.0
  cached_network_image: ^3.4.1
  card_swiper: ^2.0.4
  connectivity_plus: ^6.0.0
